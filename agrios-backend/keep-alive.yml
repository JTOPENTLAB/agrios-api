name: Keep API warm

# Render's free tier spins the service down after ~15 minutes of no traffic,
# and the next request then pays a 50+ second cold-start penalty — hurting
# both real visitors' first impression and any crawler that times out
# before the page's API calls resolve. Pinging /health every 10 minutes
# keeps the instance from ever going fully idle. This costs nothing (GitHub
# Actions free tier) and needs no Render plan upgrade.
#
# Note: this only helps while the free plan's monthly instance-hours last —
# check Render's usage dashboard occasionally. If usage becomes a problem,
# the real fix is upgrading the Render plan, not a more aggressive ping.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://agrios-api.onrender.com/health)
          echo "Health check returned HTTP $STATUS"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 400 ]; then
            echo "::warning::agrios-api /health returned $STATUS"
          fi

